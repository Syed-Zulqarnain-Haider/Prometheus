# nginx reverse proxy for Prometheus (single domain, both apps behind one host).
#
# Install:
#   sudo cp docs/nginx-prometheus.conf /etc/nginx/sites-available/prometheus
#   sudo ln -s /etc/nginx/sites-available/prometheus /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   # edit server_name below, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the HTTP (port 80) block. `sudo certbot --nginx` adds the TLS (443) server
# and an HTTP->HTTPS redirect automatically. See docs/DEPLOY-UBUNTU.md.

# WebSocket upgrade helper (valid here because sites-enabled/* is included inside the
# http{} block). If nginx reports "duplicate map", your base config already defines
# this — delete the next 4 lines.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;   # <-- replace with your domain

    # Allow report/export payloads (the API caps inputs separately).
    client_max_body_size 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    # Set at the edge so they cover BOTH apps, including /api/ JSON responses which
    # never pass through Next.js. `always` is required — without it nginx omits them
    # on error responses (4xx/5xx), which is exactly when they still matter.
    # Next.js sets the same headers for its own responses (frontend/next.config.mjs);
    # duplicates are harmless and the redundancy is deliberate.
    add_header X-Frame-Options            "DENY"                                  always;
    add_header Content-Security-Policy    "frame-ancestors 'none'"                always;
    add_header X-Content-Type-Options     "nosniff"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"       always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HSTS: uncomment ONLY after certbot has issued a certificate and HTTPS works —
    # sending it over plain HTTP pins browsers to a scheme you cannot yet serve.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"   always;

    # Don't advertise the nginx version to scanners.
    server_tokens off;

    # ── API -> FastAPI on loopback ────────────────────────────────────────────
    # No trailing slash on proxy_pass so the FULL /api/v1/... path is preserved
    # (the backend serves under /api/v1). The X-Forwarded-* headers let the app see
    # the real client IP/proto behind the proxy.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ── Everything else -> Next.js on loopback ────────────────────────────────
    # WebSocket upgrade headers support HMR and any future streaming responses.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
