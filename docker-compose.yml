# Local development dependencies only (Postgres + Redis).
# Production uses Cloud SQL (private IP) and Memorystore - never this compose file.
# Bring up:   docker compose up -d
# Then:       cd backend && alembic upgrade head

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: prometheus
      POSTGRES_PASSWORD: prometheus
      POSTGRES_DB: prometheus
    ports:
      # Loopback only: published on 0.0.0.0 this dev database (with a guessable
      # password) was reachable by anyone on the same network as the developer.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prometheus -d prometheus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      # Loopback only - this Redis holds cached user contexts and has no password.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
